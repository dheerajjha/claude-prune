[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "claude-prune"
version = "0.1.0"
description = "Stop the Claude Code processes an update leaves running, and delete the old builds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Dheeraj Jha" }]
keywords = ["claude-code", "claude", "mcp", "macos", "processes", "cleanup", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/dheerajjha/claude-prune"
Issues = "https://github.com/dheerajjha/claude-prune/issues"
Changelog = "https://github.com/dheerajjha/claude-prune/blob/main/CHANGELOG.md"

[project.scripts]
claude-prune = "claude_prune:main"

[tool.flit.module]
name = "claude_prune"
